<!-- Source for public/apple-touch-icon.png, icon-192.png and icon-512.png (rendered with sharp). Kept out of public/ on
     purpose: Chrome on Android picks an SVG icon for a home-screen shortcut and then shows a placeholder. The content sits
     inside the maskable safe zone (a centred circle of radius 40%), so the 512 PNG doubles as the maskable icon. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f5a3e"/>
      <stop offset="1" stop-color="#0f2a1e"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <path d="M170 124a26 26 0 0 1 52 0v184h94a26 26 0 0 1 0 52H196a26 26 0 0 1-26-26z" fill="#f7c972"/>
  <path d="M150 404h62l18-30 24 56 22-40h86" fill="none" stroke="#f472b6" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
